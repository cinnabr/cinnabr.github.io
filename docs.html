<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinnabar Docs</title>
<link rel="icon" href="assets/mark.png">
<link rel="stylesheet" href="lib/cinnabar.css">
<link rel="stylesheet" href="docs.css">
</head>
<body>
<header class="cb-top"></header>
<div class="toolbar" id="tb" role="toolbar" aria-label="Formatting"></div>
<div class="docwrap">
  <aside class="outline" id="outline" aria-label="Document outline"><div class="cap">Outline</div><div id="olist"></div></aside>
  <div class="scroller" id="scroller">
    <article class="paper" id="paper" contenteditable="true" spellcheck="true" aria-label="Document body"></article>
  </div>
  <div class="find" id="find" hidden>
    <input class="field" id="fq" placeholder="Find" aria-label="Find">
    <input class="field" id="fr" placeholder="Replace with" aria-label="Replace with">
    <div class="frow"><span class="muted" id="fcount"></span><span class="grow"></span>
      <button class="btn" id="fnext">Next</button><button class="btn" id="fone">Replace</button><button class="btn" id="fall">All</button>
      <button class="icon-btn" id="fclose" aria-label="Close find"></button></div>
  </div>
</div>
<footer class="dstatus" id="status"><span id="wc"></span><span class="grow"></span><span id="zoomlbl"></span></footer>
<div class="imgbar" id="imgbar" hidden>
  <button class="btn ghost" data-w="25%">S</button><button class="btn ghost" data-w="50%">M</button><button class="btn ghost" data-w="75%">L</button><button class="btn ghost" data-w="100%">Full</button><span class="sep"></span><button class="btn ghost danger" data-w="remove">Remove</button>
</div>
<script src="lib/supabase.js"></script>
<script src="lib/cinnabar.js"></script>
<script src="lib/qs.js"></script>
<script src="docs.js"></script>
</body>
</html>
