<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinnabar Sheets</title>
<link rel="icon" href="assets/mark.png">
<link rel="stylesheet" href="lib/cinnabar.css">
<link rel="stylesheet" href="sheets.css">
</head>
<body>
<header class="cb-top"></header>
<div class="toolbar" id="tb" role="toolbar" aria-label="Formatting"></div>
<div class="fbar">
  <input id="namebox" class="namebox" aria-label="Selected cell" spellcheck="false">
  <span class="fx">fx</span>
  <input id="formula" class="formula" aria-label="Cell contents" spellcheck="false" autocomplete="off">
</div>
<div class="gridwrap" id="gridwrap" tabindex="0" aria-label="Spreadsheet grid">
  <table class="grid" id="grid"></table>
  <div class="selbox" id="selbox"></div>
  <div class="cur" id="cur"></div>
  <input class="cell-editor" id="editor" spellcheck="false" autocomplete="off" hidden>
</div>
<footer class="sbar">
  <button class="icon-btn" id="addsheet" title="Add sheet" aria-label="Add sheet"></button>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="grow"></div>
  <div class="stats" id="stats"></div>
</footer>
<script src="lib/supabase.js"></script>
<script src="lib/cinnabar.js"></script>
<script src="lib/qs.js"></script>
<script src="lib/formula.js"></script>
<script src="sheets.js"></script>
</body>
</html>
