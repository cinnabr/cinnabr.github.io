<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinnabar Slides</title>
<link rel="icon" href="assets/mark.png">
<link rel="stylesheet" href="lib/cinnabar.css">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<header class="cb-top"></header>
<div class="toolbar" id="tb" role="toolbar" aria-label="Slide tools"></div>
<div class="work">
  <aside class="strip" id="strip" aria-label="Slides"></aside>
  <main class="stagewrap" id="stagewrap">
    <div class="stage" id="stage" aria-label="Slide canvas"></div>
    <textarea class="notes" id="notes" placeholder="Speaker notes" aria-label="Speaker notes"></textarea>
  </main>
  <aside class="props" id="props" aria-label="Properties"></aside>
</div>
<div class="present" id="present" hidden>
  <div class="pstage" id="pstage"></div>
  <div class="pbar" id="pbar"></div>
</div>
<script src="lib/supabase.js"></script>
<script src="lib/cinnabar.js"></script>
<script src="lib/qs.js"></script>
<script src="slides.js"></script>
</body>
</html>
